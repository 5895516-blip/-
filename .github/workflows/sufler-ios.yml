name: Sufler iOS

on:
  push:
    branches: ["claude/**"]
    paths:
      - "Sufler/**"
      - ".github/workflows/sufler-ios.yml"
  workflow_dispatch:

concurrency:
  group: sufler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT: Sufler/Sufler.xcodeproj
  SCHEME: Sufler
  BUNDLE_ID: com.blip5895516.sufler

jobs:
  # Full check on the newest Xcode: build, unit tests, screenshots and an unsigned IPA.
  build:
    name: Build, test, screenshots
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          python3 Sufler/tools/gen_xcodeproj.py
          git diff --exit-code -- Sufler/Sufler.xcodeproj || { echo "::error::project.pbxproj is out of date, run Sufler/tools/gen_xcodeproj.py"; exit 1; }

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 Sufler/tools/pick_simulator.py)
          echo "Simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p build/frames
          export TEST_RUNNER_SUFLER_FRAME_DIR="$PWD/build/frames"
          set +e
          xcodebuild test \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            > build/test.log 2>&1
          STATUS=$?
          set -e
          bash Sufler/tools/summarize_log.sh build/test.log
          exit $STATUS

      - name: Screenshots
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p build/screens
          APP=build/dd/Build/Products/Debug-iphonesimulator/Sufler.app
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          shoot() {
            local name=$1 wait=$2
            shift 2
            xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "build/screens/$name.png"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
            sleep 1
          }
          shoot 01-list 6
          shoot 02-editor 6 -sufler.screen editor
          shoot 03-floating 6 -sufler.screen floating
          shoot 04-floating-playing 10 -sufler.screen floating -sufler.autoplay YES
          sips -Z 1300 build/screens/*.png > /dev/null
          ls -la build/screens build/frames

      - name: Unsigned IPA
        run: |
          set +e
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/dd-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build/device.log 2>&1
          STATUS=$?
          set -e
          bash Sufler/tools/summarize_log.sh build/device.log
          [ $STATUS -eq 0 ] || exit $STATUS
          mkdir -p build/ipa/Payload
          cp -R build/dd-device/Build/Products/Release-iphoneos/Sufler.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Sufler-unsigned.ipa Payload)
          ls -la build/Sufler-unsigned.ipa

      - name: Upload pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pictures
          path: |
            build/screens
            build/frames
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sufler-unsigned-ipa
          path: build/Sufler-unsigned.ipa

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/*.log
          if-no-files-found: ignore

  # The same sources must also compile with the previous major Xcode.
  compat:
    name: Build with Xcode 16
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator
        run: |
          xcodebuild -version
          mkdir -p build
          set +e
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            > build/compat.log 2>&1
          STATUS=$?
          set -e
          bash Sufler/tools/summarize_log.sh build/compat.log
          exit $STATUS
