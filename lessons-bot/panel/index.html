<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Панель бота</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell" id="shell" hidden>
    <aside class="rail">
      <div class="station">
        <span class="lamp" id="lamp" aria-hidden="true"></span>
        <div class="station-text">
          <strong id="lampText">Эфир свободен</strong>
          <span id="botName"></span>
        </div>
      </div>
      <nav class="nav" id="nav" aria-label="Разделы">
        <a href="#overview" data-view="overview">Обзор</a>
        <a href="#broadcasts" data-view="broadcasts">Рассылки</a>
        <a href="#lessons" data-view="lessons">Уроки</a>
        <a href="#autos" data-view="autos">Авто</a>
        <a href="#users" data-view="users">Люди</a>
        <a href="#settings" data-view="settings">Настройки</a>
      </nav>
      <button class="rail-exit" id="logout" type="button">Выйти</button>
    </aside>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <dialog class="dialog" id="dialog"></dialog>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
